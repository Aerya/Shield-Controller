name: Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx biome check src/server/api/DeviceManagerApi.ts src/server/__tests__/deviceManagerApi.test.ts src/app/googDevice/client/DeviceManagerModal.ts src/app/googDevice/client/__tests__/DeviceManagerModal.test.ts src/style/device-manager.css
      - run: npm test -- --maxWorkers=4
      - run: npm run build
