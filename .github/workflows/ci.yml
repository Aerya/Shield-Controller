name: Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx biome check src/server/api/DeviceManagerApi.ts src/server/__tests__/deviceManagerApi.test.ts src/app/googDevice/client/DeviceManagerModal.ts src/app/googDevice/client/__tests__/DeviceManagerModal.test.ts src/style/device-manager.css src/server/DeviceOptimization.ts src/server/__tests__/deviceOptimization.test.ts src/app/googDevice/client/OptimizationPanel.ts src/app/googDevice/client/OptimizationCatalog.ts src/app/googDevice/client/__tests__/OptimizationPanel.test.ts
      - run: npx biome check src/server/TvMaintenance.ts src/server/TvCompatibility.ts src/server/DeviceSnapshot.ts src/server/__tests__/tvMaintenance.test.ts src/server/__tests__/deviceSnapshot.test.ts src/app/googDevice/client/MaintenancePanel.ts src/app/googDevice/client/TweaksPanel.ts
      # Test the native addon built for this runner rather than a mutable upstream prebuild.
      - name: Compiler node-pty pour le runner
        run: |
          npm exec --yes --package=node-gyp@13.1.0 -- node-gyp rebuild --directory node_modules/node-pty
          node -e "require('node-pty')"
      - run: npm test -- --maxWorkers=4
      - name: Installer les navigateurs et dépendances Playwright
        timeout-minutes: 8
        run: |
          # Avoid the Azure Ubuntu mirror, observed downloading at about 45 KiB/s.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          npx playwright install --with-deps chromium firefox
      - run: npm run test:layout
      - run: npm run build
